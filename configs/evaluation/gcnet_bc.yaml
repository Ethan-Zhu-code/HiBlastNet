paths:
  model_path: ../../weights/current_bc_control_seed100.pth  # use --model-path for seeds 101/102
  dataset_root: ../../data/blastleaf
  output_dir: ../../outputs/gcnet_bc
data:
  full_leaf_split: test
model:
  name: gcnet_s
  num_classes: 4
  gcnet_channels: 32
  gcnet_ppm_channels: 128
  gcnet_head_channels: 64
  gcnet_detail_channels_multiplier: 1.5
  lesion_aux_head: true
  gcnet_multiscale_detail_refinement: true
  gcnet_multiscale_detail_channels: 32
  gcnet_multiscale_context_branch: true
  gcnet_multiscale_boundary_fusion: true
  decoder_embed_dim: 256
  drop_path_rate: 0.1
  pidnet_augment: true
  deploy: true
inference_tiling:
  tile_height: 1024
  tile_width: 640
  stride_y: 768
  stride_x: 480
  hann_min_weight: 0.001
  batch_size: 4
runtime:
  amp: auto
  compile: 'off'
visualization:
  save_preds: true
  visualize: true
evaluation:
  component_connectivity: 8
  component_iou_threshold: 0.1
  component_area_bins:
  - 32
  - 128
  - 512
  boundary_tolerance_px: 2
